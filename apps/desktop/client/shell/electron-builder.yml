appId: com.lumenstorm.orisonspace
productName: Orison Space
copyright: Copyright © 2026 LumenStorm

directories:
  output: ../../../../release
  buildResources: resources

files:
  - dist/**
  - resources/**
  - package.json
  - node_modules/**
  # Trim packaging bloat. These are either non-runtime build artifacts or
  # renderer-only libs that Vite already bundles into dist/renderer.
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"
  - "!node_modules/better-sqlite3/build/Release/obj/**"
  - "!node_modules/material-symbols/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3/**"

npmRebuild: true
buildDependenciesFromSource: false

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Orison Space

# 禁用 blockmap（增量更新），减少 Release 页附件数量。
generateUpdatesFilesForAllChannels: false
electronDifferentialDownload: false

# macOS 同时出 arm64(Apple Silicon) 与 x64(Intel) 两份 dmg。
mac:
  # 单张高分辨率 PNG 即可，electron-builder 在 macOS 构建机上自动转 .icns。
  icon: resources/icon.png
  category: public.app-category.productivity
  # Alpha 阶段无 Apple 开发者证书，显式关闭签名，避免打包失败。
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64

linux:
  icon: resources/icon.png
  category: Office
  target:
    - target: AppImage # 跨发行版的免安装可执行格式

publish:
  provider: github
  owner: LumenStorm
  repo: OrisonSpace
