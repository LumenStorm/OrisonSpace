appId: com.lumenstorm.orisonspace
productName: Orison Space
copyright: Copyright © 2026 LumenStorm

directories:
  output: ../../../../release
  buildResources: resources

files:
  - dist/**
  - resources/**
  - package.json
  - node_modules/**

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3/**"

npmRebuild: true
buildDependenciesFromSource: false

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Orison Space

# mac/linux 不锁定 arch：electron-builder 默认按构建机 CPU 架构打包。
# release.yml 当前用单一 macos-latest(arm64) runner 出包，避免多架构各自
# 产出 latest-mac.yml 互相覆盖、破坏 electron-updater 自动更新。
mac:
  # 单张高分辨率 PNG 即可，electron-builder 在 macOS 构建机上自动转 .icns。
  icon: resources/icon.png
  category: public.app-category.productivity
  # Alpha 阶段无 Apple 开发者证书，显式关闭签名，避免打包失败。
  identity: null
  target:
    - target: dmg
    - target: zip # electron-updater 的 macOS 自动更新依赖 zip 包

linux:
  icon: resources/icon.png
  category: Office
  target:
    - target: AppImage # 跨发行版的免安装可执行格式

publish:
  provider: github
  owner: LumenStorm
  repo: OrisonSpace
