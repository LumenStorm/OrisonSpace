appId: com.lumenstorm.orisonspace
productName: Orison Space
copyright: Copyright © 2026 LumenStorm

directories:
  output: ../../../../release
  buildResources: resources

files:
  - dist/**
  - resources/**
  - package.json
  - node_modules/**

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3/**"

npmRebuild: true
buildDependenciesFromSource: false

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Orison Space

# macOS 同时出 arm64(Apple Silicon) 与 x64(Intel) 两份包。
# 关键：两种架构在同一次 electron-builder 调用里产出，因此只生成一份
# latest-mac.yml（同时引用两个 zip），electron-updater 按 process.arch
# 自动选择正确架构——无需第二个 runner，也不会出现 feed 互相覆盖。
mac:
  # 单张高分辨率 PNG 即可，electron-builder 在 macOS 构建机上自动转 .icns。
  icon: resources/icon.png
  category: public.app-category.productivity
  # Alpha 阶段无 Apple 开发者证书，显式关闭签名，避免打包失败。
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip # electron-updater 的 macOS 自动更新依赖 zip 包
      arch:
        - arm64
        - x64

linux:
  icon: resources/icon.png
  category: Office
  target:
    - target: AppImage # 跨发行版的免安装可执行格式

publish:
  provider: github
  owner: LumenStorm
  repo: OrisonSpace
