appId: com.lumenstorm.orisonspace
productName: Orison Space
copyright: Copyright © 2026 LumenStorm

directories:
  output: ../../../../release/portable
  buildResources: resources

files:
  - dist/**
  - resources/**
  - package.json
  - node_modules/**
  # Trim packaging bloat. These are either non-runtime build artifacts or
  # renderer-only libs that Vite already bundles into dist/renderer.
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"
  - "!node_modules/better-sqlite3/build/Release/obj/**"
  - "!node_modules/material-symbols/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3/**"

npmRebuild: true
buildDependenciesFromSource: false

win:
  icon: resources/icon.ico
  target:
    - target: dir
      arch:
        - x64

publish: null
