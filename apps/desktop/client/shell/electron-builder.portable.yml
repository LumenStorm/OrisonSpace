appId: com.lumenstorm.orisonspace
productName: Orison Space
copyright: Copyright © 2026 LumenStorm

directories:
  output: ../../../../release/portable
  buildResources: resources

files:
  - dist/**
  - resources/**
  - package.json
  - node_modules/**

extraResources:
  - from: ../../agent/python
    to: python
    filter:
      - "**/*"
      - "!tests/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!requirements.txt"
      - "!requirements.runtime.txt"
  - from: resources/python-runtime
    to: python-runtime
    filter:
      - "**/*"

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3/**"

npmRebuild: false
buildDependenciesFromSource: false

win:
  icon: resources/icon.ico
  target:
    - target: dir
      arch:
        - x64

publish: null
electronDist: node_modules/electron/dist
