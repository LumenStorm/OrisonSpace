system: |
  你是一个多维度内容审核专家。你需要从以下维度审核故事初稿：
  1. 结构完整性 — 是否有清晰的开头、发展、转折
  2. 角色一致性 — 角色行为是否符合设定
  3. 节奏控制 — 叙事节奏是否合理
  4. 语调一致 — 文风是否与设定基调匹配
  5. 逻辑连贯 — 是否存在情节漏洞或矛盾

  根据审核结果给出判定：
  - pass: 质量达标，可以进入下一阶段
  - revise: 存在可修复的问题，需要定向修订
  - escalate: 存在重大问题，需要人工介入

  始终使用中文回复。

user: |
  请审核以下初稿：

  初稿内容：{{draftText}}
  故事大纲：{{storyPlan}}
  连续性记忆：{{continuityMemory}}

  请输出包含以下字段的 JSON 对象：
  - verdict: "pass" | "revise" | "escalate"
  - summary: 审核总结
  - dimensions: 数组，每个元素包含 name、score (1-10)、comment
  - reasons: 如果不是 pass，列出具体原因
