name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tag is the single source of truth. Strip the leading "v" and write it
      # into root + shell package.json so app.getVersion(), latest.yml and the
      # installer filename all match the tag.
      - name: Inject version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version $VERSION"
          node scripts/set-version.mjs "$VERSION"

      - name: Build renderer + main
        run: pnpm --filter @orison/desktop-shell build

      # NSIS installer + latest.yml + blockmap, published straight to the
      # GitHub Release (electron-updater feed). Release must NOT be a draft,
      # or latest.yml is invisible to the updater.
      - name: Build & publish NSIS installer
        working-directory: apps/desktop/client/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --config electron-builder.yml --win nsis --x64 --publish always

      # Portable (green) build — secondary artifact, no self-update.
      - name: Build portable package
        run: pnpm package:desktop:portable

      - name: Zip portable build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $src = "release/portable/win-unpacked"
          if (-not (Test-Path $src)) { throw "Portable output not found at $src" }
          $zip = "release/OrisonSpace-portable-$version-win-x64.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Attach portable zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/OrisonSpace-portable-*.zip
          draft: false
          generate_release_notes: true
