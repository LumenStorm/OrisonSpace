name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the portable app dir via electron-builder --dir.
      - name: Build portable package
        run: pnpm package:desktop:portable

      - name: Zip portable build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $src = "release/portable/win-unpacked"
          if (-not (Test-Path $src)) { throw "Portable output not found at $src" }
          $zip = "release/OrisonSpace-portable-$version-win-x64.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: orison-space-portable-windows
          path: release/OrisonSpace-portable-*.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/OrisonSpace-portable-*.zip
          draft: true
          generate_release_notes: true
